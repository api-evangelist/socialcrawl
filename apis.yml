aid: socialcrawl
name: SocialCrawl
description: >-
  SocialCrawl is a unified social, commerce and research data API: one key, one response schema,
  50 platforms and roughly 400 endpoints, plus a cross-platform search that fans out across 17
  sources in a single call. The social side covers TikTok, Instagram, YouTube, X, LinkedIn,
  Reddit, Threads, Pinterest, Facebook, Snapchat, Twitch, Truth Social and Kick; the non-social
  side covers Amazon, Polymarket, Hacker News, GitHub, Google Search, Perplexity and Tavily.
  Responses are normalised to one shape regardless of source. The published contract is an
  OpenAPI 3.1 document of 403 paths and 411 operations across 58 tags, with a free tier of 100
  credits and no card required.
type: Index
url: https://raw.githubusercontent.com/api-evangelist/socialcrawl/refs/heads/main/apis.yml
created: '2026-08-25'
modified: '2026-08-25'
specificationVersion: '0.23'
