x-provenance:
  added: '2026-08-25'
  method: searched
  source: https://www.socialcrawl.dev/apis.json
  note: >-
    Submitted via apis.io/add on 2026-08-25 and auto-published by the gate at rating 23. The
    declared APIs.json is CORRECT — served as application/json at spec version 0.23, against a
    control path that returns a real 404 — and it declares seventeen properties on the API plus
    fourteen common ones, which is unusually complete.
    THE SPECIFICATION IS 18.2 MB. SocialCrawl publishes two: /openapi.json at 18,208,946 bytes and
    /openapi-slim.json at 4,643,313. The SLIM one is stored here, because 18MB of JSON in a
    provider repo is a cost with no reader; the full document is recorded as APIReference so it
    stays one fetch away. The slim copy is itself substantial: OpenAPI 3.1, 403 paths, 411
    operations, 58 tags.
    TWO DECLARED TYPES DO NOT MATCH WHAT IS SERVED, and are deliberately NOT recorded under those
    types. The provider declares /unified-schema as JSONSchema and /mcp-server as MCPServer, but
    both return text/html — they are pages about those things, not the documents themselves. Both
    are live (200, and distinct from the 404 control), so this is mis-typing rather than absence.
    Recording an HTML page as a JSON Schema or an MCP server would credit a machine-readable
    artifact that does not exist.
    ON WHAT THIS SERVICE IS. It scrapes named individuals' public profiles and engagement from
    platforms whose users did not consent to it — the provider's own homepage example pulls a
    named TikTok creator's follower and like counts. That is the same family as a submission
    refused on policy grounds on 2026-08-20. It is listed here because roughly half its surface is
    not personal data at all (Amazon, Polymarket, Hacker News, GitHub, Google Search, Perplexity,
    Tavily), which makes it a general data API rather than a personal-data product, and because
    the call was reviewed and taken deliberately rather than by default.
    Note the contact address is on ridio.io, not socialcrawl.dev.
