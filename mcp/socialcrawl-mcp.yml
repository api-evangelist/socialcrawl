tools:
- name: socialcrawl_find
  description: 'Start here: a task in plain words -> the best endpoints (3 by default) of 646, each with
    the params the task supplies (URLs and @handles resolved), the params still missing, the credit cost
    and the exact call. With no task it lists platforms, or one platform''s endpoints. Free; no key needed.'
- name: socialcrawl_endpoint
  description: 'Read before calling: one endpoint''s purpose, params, where the rows are and up to 25
    response fields, cost rule, paging, latency, timeout, next endpoints and a sample link. id (or platform+resource,
    path), a platform slug (its endpoints) or a guide topic. Free.'
- name: socialcrawl_estimate
  description: 'Exact credits before you spend: one call (id, platform+resource or path, plus the params
    you will send; calls for a job total; items for a walk) or a plan of several calls. Uses the API''s
    estimator when available, else the bundled pricing. A platform slug gives its price table; no id gives
    the pricing overview. Free.'
- name: socialcrawl_request
  description: Call one endpoint (platform+resource, or id, or path). Validated locally first (a bad call
    is free), quoted, refused above max_credits and confirmed above the threshold. A large page is cut
    at row boundaries; socialcrawl_collect result_id reads the rest. Spends credits; needs SOCIALCRAWL_API_KEY.
- name: socialcrawl_collect
  description: 'Walk a paged endpoint (id, platform+resource or path) to `items` unique rows, the last
    page or max_credits: cursors supplied, duplicates dropped, stops on a 402, refused free when one page
    exceeds max_credits. Small results come back whole. result_id (+offset, limit, format) reads a stored
    result, free. Spends credits.'
- name: socialcrawl_account
  description: 'Free checks: balance (with this session''s spend), transactions (itemised ledger; the
    receipts for one request_id), status (platform health; read it before retrying a 502/503) and freshness
    (whether this server''s bundled catalogue is behind the API).'
- name: socialcrawl_manage
  description: 'Stateful work by area + action: monitors (scheduled recipes, webhooks, alerts), cohorts
    (mention search over your own panel of accounts), web (scrape, search, crawl and agent jobs, change
    monitors, browser sessions) and jobs (Prism background jobs). A wrong field is refused free with the
    rules. Managing is free; scrapes, jobs, queries and monitor runs bill credits.

    dry_run: true validates and quotes a create/update and never creates it. rows_new alerts need track
    (id=monitors).'
