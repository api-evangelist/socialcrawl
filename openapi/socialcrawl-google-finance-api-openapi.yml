                                      - 'null'
                                      description: Numeric at quote.price.year_high
                                    timestamp:
                                      type:
                                      - string
                                      - 'null'
                                      description: String at quote.price.timestamp
                                metrics:
                                  type:
                                  - object
                                  - 'null'
                                  description: Fundamentals (market_cap, pe_ratio, dividend_yield, expense_ratio, …); null on thin rows
                                  properties:
                                    market_cap:
                                      type:
                                      - integer
                                      - 'null'
