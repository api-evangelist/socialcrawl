                                  - string
                                  - 'null'
                                  description: Leaf at quote.peers.price.trend
                                day_low:
                                  type:
                                  - integer
                                  - 'null'
                                  description: Numeric at quote.peers.price.day_low
                                day_high:
                                  type:
                                  - integer
                                  - 'null'
                                  description: Numeric at quote.peers.price.day_high
                                year_low:
                                  type:
                                  - integer
                                  - 'null'
                                  description: Numeric at quote.peers.price.year_low
                                year_high:
